*{
    box-sizing:border-box;
    margin:0;

    font-family:Arial, sans-serif;

    background:#101114;

<body>

<header>
    <h1>🧠 Alif Math Solver</h1>
    <p>Simple, fast and powerful math solver</p>
</header>

<div class="container">

    <div class="card">
        <label for="problem">Enter your math problem</label>

        <textarea id="problem"
        placeholder="Example:
2 + 3 * 4

or

x + 5 = 12

or

2x + 4 = 10"></textarea>

        <div class="buttons">
            <button onclick="solve()">Solve</button>
            <button class="secondary" onclick="clearProblem()">Clear</button>
            <button class="secondary" onclick="example()">Example</button>
        </div>

        <div class="example">
            Supports basic arithmetic and simple linear equations.
        </div>
    </div>

    <div class="card result" id="resultBox">
        <h2>📖 Solution</h2>
        <div class="answer" id="answer"></div>
    </div>

    <div class="card">
        <h2>🕘 History</h2>
        <div id="history">
            <p style="color:#858b97;margin-top:10px;">
                No calculations yet.
            </p>
        </div>
    </div>

</div>

<footer>
    © 2026 Alif Math Solver
</footer>

<script>

const problemInput = document.getElementById("problem");
const resultBox = document.getElementById("resultBox");
const answerBox = document.getElementById("answer");
const historyBox = document.getElementById("history");

let history = [];

function solve(){

    const input = problemInput.value.trim();

    if(!input){
        alert("Please enter a math problem.");
        return;
    }

    let output = "";

    // Linear equation detector
    if(input.includes("=") && /x/i.test(input)){

        output = solveEquation(input);

    }else{

        // Basic calculator
        try{

            let expression = input
                .replace(/×/g,"*")
                .replace(/÷/g,"/")
                .replace(/\^/g,"**");

            // Only allow safe mathematical characters
            if(!/^[0-9+\-*/().%\s*]+$/.test(expression)){
                throw new Error("Invalid expression");
            }

            const value = Function(
                '"use strict"; return (' + expression + ')'
            )();

            if(!Number.isFinite(value)){
                throw new Error("Invalid result");
            }

            output =
                "Expression:\n" +
                input +
                "\n\nAnswer:\n" +
                value;

        }catch(error){

            output =
                "❌ I couldn't solve this expression.\n\n" +
                "Try something like:\n" +
                "2 + 3 * 4\n" +
                "25 / 5\n" +
                "7^2";
        }
    }

    answerBox.textContent = output;
    resultBox.style.display = "block";

    addHistory(input, output);
}

function solveEquation(equation){

    try{

        equation = equation.replace(/\s/g,"");

        const parts = equation.split("=");

        if(parts.length !== 2){
            return "❌ Please use one '=' sign.";
        }

        const left = parts[0];
        const right = parts[1];

        const leftParts = parseLinear(left);
        const rightParts = parseLinear(right);

        const a = leftParts.a - rightParts.a;
        const b = rightParts.b - leftParts.b;

        if(a === 0){

            if(b === 0){
                return "Infinite solutions.";
            }

            return "No solution.";
        }

        const x = b / a;

        return (
            "Equation:\n" +
            equation +
            "\n\n" +
            "Move the x terms to one side.\n" +
            "Move the numbers to the other side.\n\n" +
            "x = " + formatNumber(x)
        );

    }catch(error){

        return (
            "❌ Could not solve the equation.\n\n" +
            "Try examples such as:\n" +
            "x+5=12\n" +
            "2x+4=10\n" +
            "3x-6=9"
        );
    }
}

function parseLinear(expr){

    let a = 0;
    let b = 0;

    expr = expr.replace(/\-/g,"+-");

    const terms = expr.split("+");

    for(let term of terms){

        if(!term) continue;

        if(term.includes("x")){

            term = term.replace("x","");

            if(term === "" || term === "+"){
                a += 1;
            }else if(term === "-"){
                a -= 1;
            }else{
                a += Number(term);
            }

        }else{

            b += Number(term);
        }
    }

    return {a:a,b:b};
}

function formatNumber(num){

    if(Number.isInteger(num)){
        return num;
    }

    return Number(num.toFixed(8));
}

function clearProblem(){

    problemInput.value = "";
    answerBox.textContent = "";
    resultBox.style.display = "none";
}

function example(){

    const examples = [
        "2 + 3 * 4",
        "x + 5 = 12",
        "2x + 4 = 10",
        "3x - 6 = 9",
        "25 / 5",
        "7^2"
    ];

    const random =
        examples[Math.floor(Math.random()*examples.length)];

    problemInput.value = random;
}

function addHistory(problem, answer){

    history.unshift({
        problem:problem,
        answer:answer
    });

    if(history.length > 10){
        history.pop();
    }

    renderHistory();
}

function renderHistory(){

    if(history.length === 0){

        historyBox.innerHTML =
            '<p style="color:#858b97;margin-top:10px;">No calculations yet.</p>';

        return;
    }

    historyBox.innerHTML = "";

    history.forEach((item,index)=>{

        const div = document.createElement("div");

        div.className = "history-item";

        div.innerHTML =
            "<b>" + escapeHTML(item.problem) + "</b>" +
            "<br>" +
            "<small>" +
            escapeHTML(item.answer) +
            "</small>";

        historyBox.appendChild(div);
    });
}

function escapeHTML(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

problemInput.addEventListener("keydown",function(event){

    if(event.ctrlKey && event.key === "Enter"){
        solve();
    }

});

</script>

</body>
</html>
